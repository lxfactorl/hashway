<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hashway options</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #1e1e1e;
        color: #e6e6e6;
        max-width: 40rem;
        margin: 0 auto;
        padding: 1rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin: 0.5rem 0 0.25rem;
      }
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 0.35rem;
        background: #2d2d2d;
        color: #e6e6e6;
        border: 1px solid #555;
        border-radius: 4px;
      }
      button {
        margin: 0.25rem 0.25rem 0 0;
        padding: 0.4rem 0.75rem;
        background: #2d2d2d;
        color: #e6e6e6;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #3a3a3a;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 8rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        background: #2d2d2d;
        color: #e6e6e6;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 0.35rem;
      }
      #status {
        margin-top: 0.75rem;
        font-size: 0.9rem;
        min-height: 1.2em;
      }
      section {
        margin-top: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hashway</h1>
      <form id="options-form">
        <section>
          <h2>Real-Debrid token</h2>
          <label for="token">Real-Debrid API token</label>
          <input type="password" id="token" name="token" autocomplete="off" spellcheck="false" />
          <div>
            <button type="button" id="save">Save</button>
            <button type="button" id="clear">Clear</button>
            <button type="button" id="test">Test token</button>
          </div>
          <p>
            <a href="https://real-debrid.com/apitoken" target="_blank" rel="noopener noreferrer"
              >Open apitoken page</a
            >
          </p>
        </section>
        <section>
          <h2>Diagnostics</h2>
          <label for="diagnostics">Latest snapshot</label>
          <textarea id="diagnostics" readonly></textarea>
          <div>
            <button type="button" id="download-diagnostics">Download diagnostics</button>
          </div>
        </section>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
